name: Update GitHub Contributions

on:
  schedule:
    # Update every day at midnight UTC
    - cron: "0 0 * * *"

  # Allows you to update it manually
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate contribution calendar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/generate_contributions.py

      - name: Commit updated calendar
        uses: EndBug/add-and-commit@v9
        with:
          add: "assets/github-contributions.svg"
          message: "Update GitHub contribution calendar"
