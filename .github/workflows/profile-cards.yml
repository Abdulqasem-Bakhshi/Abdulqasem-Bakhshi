name: Generate GitHub Profile Cards

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate profile cards
        uses: seijikohara/profile-cards-action@v1
        with:
          username: Abdulqasem-Bakhshi
          cards: contributions
          output-dir: generated
          commit: true
